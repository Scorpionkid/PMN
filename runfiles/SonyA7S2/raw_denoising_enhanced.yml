# Raw Image Denoising Enhanced Configuration
# 基于PMN的Ours.yml，添加raw_image_denoising论文的简化噪声合成方法

mode: 'evaltest'
checkpoint: 'saved_model/'
fast_ckpt: 'checkpoints/SonyA7S2'
model_name: 'SonyA7S2_RawDenoising_Unet'
result_dir: 'images/'
num_gpu: 1
num_workers: 4
brightness_correct: True

dst: &base_dst
  root_dir: '/data/SID'
  bias_dir: '/data/SonyA7S2/bias'
  ds_dir: 'resources/SonyA7S2'
  dataset: 'SID_Dataset' 
  dstname: 'SID'
  command: 'augv2, idremap, darkshading2++, HB'
  camera_type: 'SonyA7S2'
  noise_code: 'pgrq'
  patch_size: 512
  H: 2848
  W: 4256
  crop_per_image: 8
  croptype: 'non-overlapping'
  wp: 16383
  bl: 512
  ori: False
  clip: True
  gpu_preprocess: True
  
  # === Raw Image Denoising 新增配置 ===
  # LLD暗帧数据配置
  use_lld_dark_frames: True
  lld_dark_frame_path: '/data/LLD_calibration'
  
  # 简化噪声合成配置
  use_simplified_noise_synthesis: True
  quantum_efficiency: 0.4  # 假设量子效率40%
  
  # 噪声合成方法权重
  SNA_rate: 0.3        # PMN原始SNA方法权重
  enhanced_rate: 0.7   # 简化噪声合成权重

dst_train:
  <<: *base_dst
  mode: 'train'
  dataset: 'Enhanced_SID_Dataset'  # 使用增强的SID数据集
  dstname: 'SID'
  command: 'augv2, idremap, darkshading2++, HB, enhanced_synthesis'  # 添加enhanced_synthesis

dst_eval:
  <<: *base_dst
  root_dir: '/data/ELD'
  mode: 'eval'
  dataset: 'ELD_Dataset' 
  dstname: 'ELD'
  iso_list: [800, 1600, 3200]
  ratio_list: [100, 200]

dst_test:
  <<: *base_dst
  mode: 'evaltest'
  dataset: 'SID_Dataset' 
  dstname: 'SID'

arch:
  name: 'UNetSeeInDark'
  in_nc: 4
  out_nc: 4
  nf: 32
  nframes: 1
  use_dpsv: False
  res: False
  cascade: False
  add: False
  lock_wb: False

hyper:
  lr_scheduler: 'WarmupCosine'
  learning_rate: 2.e-4
  batch_size: 1
  last_epoch: 0
  step_size: 10
  stop_epoch : 1800
  T: 3
  coldstart: False
  num_workers: 4
  num_gpus: 1
  save_freq: 10
  plot_freq: 100
  best_psnr: 0.