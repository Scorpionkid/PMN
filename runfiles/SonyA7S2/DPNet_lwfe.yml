mode: 'train'
checkpoint: 'saved_model/'
fast_ckpt: 'checkpoints/SonyA7S2'
model_name: 'SonyA7S2_DualPathNet_MultiFreq_nf32_13M'
result_dir: 'images/'
num_gpu: 1
num_workers: 8
brightness_correct: True

dst: &base_dst 
  root_dir: '/media/HDD3/personal_files/zhouzhou/VideoDenoisingDatasets/SID'
  bias_dir: 'resources/SonyA7S2/BiasFrame_ET_1_30'
  ds_dir: 'resources/SonyA7S2'
  dataset: 'Mix_Dataset' 
  dstname: 'SID'
  command: 'augv2, idremap, darkshading2++, HB'
  camera_type: 'SonyA7S2'
  noise_code: 'pgrq'
  patch_size: 512
  H: 2848
  W: 4256
  crop_per_image: 8
  croptype: 'non-overlapping'
  wp: 16383
  bl: 512
  ori: False
  clip: True
  gpu_preprocess: True

dst_train:
  <<: *base_dst
  mode: 'train'
  dataset: 'Mix_Dataset' 
  dstname: 'SID'
  
dst_eval:
  <<: *base_dst
  root_dir: '/media/HDD3/personal_files/zhouzhou/VideoDenoisingDatasets/ELD/ELD'
  mode: 'eval'
  dataset: 'ELD_Dataset' 
  dstname: 'ELD'
  iso_list: [800, 1600, 3200]
  ratio_list: [100, 200]
  
dst_test:
  <<: *base_dst
  mode: 'evaltest'
  dataset: 'SID_Dataset' 
  dstname: 'SID'

arch:
  name: 'DPNet_lw_fe'  # 使用新的架构类名
  in_channels: 4
  out_channels: 4
  nf: 32                     # 减少基础通道数到32
  use_dpsv: False
  res: False
  cascade: False
  add: False
  lock_wb: False
  heads: [1, 2, 4, 8]
  dilated_rates: [1, 2, 4, 8]
  use_wavelet_upsample: True
  use_sharpness_recovery: True
  use_noise_map: True
  use_texture_detection: True
  enable_intermediate_supervision: True  
  use_depthwise_separable: False

loss:
  perceptual: True  
  gradient: True
  multiloss: False    

hyper:
  lr_scheduler: 'WarmupCosine'
  learning_rate: 2.e-4
  batch_size: 1
  resume_from_epoch: 0
  last_epoch: 0
  step_size: 10
  stop_epoch: 1800
  T: 3
  coldstart: False
  num_workers: 8
  num_gpus: 1
  save_freq: 10
  plot_freq: 100
  best_psnr: 0.

# 参数量预期分析
# 基础网络 (nf=32): ~13M 参数
# 新增频域增强参数量:
# - enc1_detail: 2*32 = 64 参数
# - enc2_detail: 2*64 = 128 参数  
# - enc3_detail: 2*128 = 256 参数
# - enc1_denoise: 2*32 = 64 参数
# - enc2_denoise: 2*64 = 128 参数
# - enc3_denoise: 2*128 = 256 参数
# 总计新增: 896 参数 ≈ 0.001M
# 最终参数量: ~13M (几乎无增加)